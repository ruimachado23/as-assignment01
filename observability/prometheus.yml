global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "nopcommerce"
    # Adjust target to wherever the nopCommerce app exposes its metrics
    # When running locally: host.docker.internal:5000
    # When running in Docker alongside the app: nopcommerce:8080
    static_configs:
      - targets: ["nopcommerce:80"]
